# dsh-activity-heatmap bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the dsh.bundle.patch
# manifest field) over dsh-base; install with
#   dsh plugin --profile <name> add link:<repo>/packages/dsh-activity-heatmap
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (session/git stats aggregation + the /activity-heatmap/*
# routes), and the dsh.client declaration in package.json makes the browser
# half (exports "./client") load in the web GUI sidebar.
- insert:
    - id: ui-activity-heatmap
      name: '@linxin666/dsh-client-ui-activity-heatmap'